<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Valentine's Day ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Cormorant+Garamond:wght@300;400&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --rose: #ff6b9d;
            --deep-rose: #c9184a;
            --blush: #ffb3c6;
            --cream: #fff0f3;
            --gold: #d4af37;
        }

        body {
            font-family: 'Cormorant Garamond', serif;
            background: linear-gradient(135deg, #fce4ec 0%, #fff0f3 50%, #ffe4e9 100%);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Floating hearts background */
        .heart-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .heart {
            position: absolute;
            font-size: 35px;
            opacity: 0;
            animation: floatHeart 15s infinite;
        }

        .heart::before {
            content: '🩷';
        }

        @keyframes floatHeart {
            0% {
                transform: translateY(100vh) rotate(0deg) scale(0);
                opacity: 0;
            }
            10% {
                opacity: 0.6;
            }
            90% {
                opacity: 0.4;
            }
            100% {
                transform: translateY(-20vh) rotate(360deg) scale(1);
                opacity: 0;
            }
        }

        /* Rose petals (flying) */
        .flower-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .rose-petal-flying {
            position: absolute;
            width: 25px;
            height: 30px;
            background: linear-gradient(135deg, #ffb3d9 0%, #ff69b4 100%);
            border-radius: 50% 50% 50% 0;
            opacity: 0;
            animation: floatPetal 18s infinite;
            box-shadow: 0 2px 8px rgba(255, 105, 180, 0.3);
        }

        @keyframes floatPetal {
            0% {
                transform: translateY(100vh) translateX(0) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.8;
            }
            90% {
                opacity: 0.6;
            }
            100% {
                transform: translateY(-20vh) translateX(100px) rotate(360deg);
                opacity: 0;
            }
        }

        /* Bottom garden with grass and flowers */
        .bottom-garden {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 180px;
            z-index: 5;
            pointer-events: none;
        }

        .grass {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 40px;
            background: linear-gradient(180deg, #7cb342 0%, #558b2f 100%);
        }

        .grass::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 10px;
            background: repeating-linear-gradient(
                90deg,
                transparent,
                transparent 3px,
                #689f38 3px,
                #689f38 4px
            );
        }

        .garden-flower {
            position: absolute;
            bottom: 40px;
            animation: sway 3s ease-in-out infinite;
        }

        .garden-flower:nth-child(2) { left: 5%; animation-delay: 0s; }
        .garden-flower:nth-child(3) { left: 12%; animation-delay: 0.5s; }
        .garden-flower:nth-child(4) { left: 19%; animation-delay: 1s; }
        .garden-flower:nth-child(5) { left: 26%; animation-delay: 0.3s; }
        .garden-flower:nth-child(6) { left: 33%; animation-delay: 0.7s; }
        .garden-flower:nth-child(7) { left: 40%; animation-delay: 0.2s; }
        .garden-flower:nth-child(8) { left: 47%; animation-delay: 0.9s; }
        .garden-flower:nth-child(9) { left: 54%; animation-delay: 0.4s; }
        .garden-flower:nth-child(10) { left: 61%; animation-delay: 0.6s; }
        .garden-flower:nth-child(11) { left: 68%; animation-delay: 0.8s; }
        .garden-flower:nth-child(12) { left: 75%; animation-delay: 0.1s; }
        .garden-flower:nth-child(13) { left: 82%; animation-delay: 0.45s; }
        .garden-flower:nth-child(14) { left: 89%; animation-delay: 0.65s; }
        .garden-flower:nth-child(15) { left: 96%; animation-delay: 0.35s; }

        .flower-stem {
            width: 4px;
            height: 80px;
            background: linear-gradient(180deg, #7cb342 0%, #558b2f 100%);
            margin: 0 auto;
            position: relative;
        }

        .flower-head {
            width: 45px;
            height: 45px;
            position: absolute;
            top: -45px;
            left: 50%;
            transform: translateX(-50%);
        }

        /* Create a fluffy dandelion look with overlapping circles */
        .puff {
            position: absolute;
            width: 8px;
            height: 8px;
            background: #fdd835;
            border-radius: 50%;
            box-shadow: 0 0 3px rgba(253, 216, 53, 0.8);
        }

        /* Arrange puffs in a circular pattern for a natural dandelion */
        .puff:nth-child(1) { top: 18px; left: 6px; }
        .puff:nth-child(2) { top: 10px; left: 10px; }
        .puff:nth-child(3) { top: 5px; left: 18px; }
        .puff:nth-child(4) { top: 10px; left: 26px; }
        .puff:nth-child(5) { top: 18px; left: 30px; }
        .puff:nth-child(6) { top: 26px; left: 26px; }
        .puff:nth-child(7) { top: 31px; left: 18px; }
        .puff:nth-child(8) { top: 26px; left: 10px; }
        .puff:nth-child(9) { top: 13px; left: 18px; }
        .puff:nth-child(10) { top: 18px; left: 13px; }
        .puff:nth-child(11) { top: 18px; left: 23px; }
        .puff:nth-child(12) { top: 23px; left: 18px; }
        .puff:nth-child(13) { top: 18px; left: 18px; background: #f9a825; width: 10px; height: 10px; }

        @keyframes sway {
            0%, 100% {
                transform: rotate(-2deg);
            }
            50% {
                transform: rotate(2deg);
            }
        }

        /* Main content */
        .content {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 40px 20px;
            text-align: center;
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: clamp(3rem, 10vw, 6rem);
            font-weight: 700;
            color: var(--deep-rose);
            margin-bottom: 20px;
            letter-spacing: 2px;
            animation: fadeInUp 1s ease-out;
            text-shadow: 2px 2px 4px rgba(201, 24, 74, 0.1);
        }

        .message {
            font-size: clamp(1.2rem, 3vw, 1.8rem);
            color: var(--rose);
            max-width: 600px;
            line-height: 1.8;
            margin-bottom: 30px;
            animation: fadeInUp 1s ease-out 0.3s backwards;
            font-weight: 300;
        }

        .decorative-line {
            width: 200px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--blush), transparent);
            margin: 30px auto;
            animation: fadeIn 1s ease-out 0.6s backwards;
        }


        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        /* Sparkles */
        .sparkle {
            position: fixed;
            pointer-events: none;
            z-index: 100;
        }

        .sparkle::before {
            content: '✨';
            font-size: 20px;
            animation: sparkleAnim 1.5s ease-out forwards;
        }

        @keyframes sparkleAnim {
            0% {
                opacity: 1;
                transform: translateY(0) scale(0);
            }
            50% {
                opacity: 1;
                transform: translateY(-30px) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(-60px) scale(0);
            }
        }
    </style>
</head>

    <script>
        // Create floating hearts
        function createHeart() {
            const heart = document.createElement('div');
            heart.className = 'heart';
            heart.style.left = Math.random() * 100 + '%';
            heart.style.animationDuration = (Math.random() * 10 + 10) + 's';
            heart.style.animationDelay = Math.random() * 5 + 's';
            
            // Randomize heart size
            const size = Math.random() * 15 + 10;
            heart.style.width = size + 'px';
            heart.style.height = size + 'px';
            
            // Randomize opacity
            heart.style.setProperty('--max-opacity', Math.random() * 0.4 + 0.3);
            
            document.getElementById('heartContainer').appendChild(heart);
        }

        // Create floating rose petals
        function createRosePetal() {
            const petal = document.createElement('div');
            petal.className = 'rose-petal-flying';
            petal.style.left = Math.random() * 100 + '%';
            petal.style.animationDuration = (Math.random() * 12 + 12) + 's';
            petal.style.animationDelay = Math.random() * 5 + 's';
            
            // Randomize petal size
            const size = Math.random() * 15 + 20;
            petal.style.width = size + 'px';
            petal.style.height = size * 1.2 + 'px';
            
            document.getElementById('flowerContainer').appendChild(petal);
        }

        // Create sparkles on click
        document.addEventListener('click', (e) => {
            const sparkle = document.createElement('div');
            sparkle.className = 'sparkle';
            sparkle.style.left = e.clientX + 'px';
            sparkle.style.top = e.clientY + 'px';
            document.body.appendChild(sparkle);
            
            setTimeout(() => sparkle.remove(), 1500);
        });

        // Initialize
        for (let i = 0; i < 25; i++) {
            createHeart();
        }

        for (let i = 0; i < 12; i++) {
            createRosePetal();
        }

        // Continuously create new hearts and rose petals
        setInterval(createHeart, 2000);
        setInterval(createRosePetal, 3500);
    </script>
